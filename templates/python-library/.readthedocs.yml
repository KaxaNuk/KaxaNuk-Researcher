# How Read the Docs builds the documentation: https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    install:
      - pip install --upgrade pip
      - pip install .
      - pip install --group docs

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true
