# Tests every push and pull request on each Python the library supports, builds it, and publishes a
# vX.Y.Z tag to PyPI: the shape of the KaxaNuk Data Curator's workflow, with PyPI's trusted
# publishing in place of a stored token. Once, before the first release, the owner adds a pending
# publisher on pypi.org for this repository, workflow main.yml and environment pypi; the same on
# test.pypi.org with environment testpypi lets a run started by hand from the Actions tab publish a
# try there.
name: Build and Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run sphinx-build -W -b html docs/source docs/_build/html
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # A vX.Y.Z tag pushed: the release, to PyPI.
  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: The tag names the version built
        run: ls "dist/"*"-${GITHUB_REF_NAME#v}-py3-none-any.whl"
      - uses: pypa/gh-action-pypi-publish@release/v1

  # A run started by hand from the Actions tab: a try, to TestPyPI, which takes each version once.
  try-on-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
