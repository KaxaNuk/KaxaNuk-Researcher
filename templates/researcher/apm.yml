name: kaxanuk-researcher
version: 0.10.0
description: A KaxaNuk researcher — a companion you name and teach, with the KaxaNuk Strategy Template's process built in, that keeps a library of what you read and drafts the hypothesis of every strategy you build
author: KaxaNuk
license: MIT

# The researcher's skills and commands are installed once for the user, not here:
# `apm install -g KaxaNuk/KaxaNuk-Researcher`, which carries every Investment Lab skill itself,
# and `apm update -g` brings new versions. Every folder — this home, and every strategy —
# then has them, and a strategy installs nothing. `apm install --target <agent>` here deploys
# this home's own agent, from `.apm/agents/`, which `interview` writes, and any skill or command
# of this home's own in `.apm/skills/` or `.apm/prompts/`.
dependencies:
  apm: []
  mcp: []

# A bare `apm install` deploys to every target below; `--target <one>` deploys to just yours.
# These four are the ones that take an agent; the rest have no agent primitive or reject its
# tool list.
targets:
  - claude
  - copilot
  - cursor
  - codex

# What publishes: `.apm/` and nothing else, so a private reading list under `Sources/` or
# `Knowledge/` cannot ship.
includes: auto
