<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="title desc">
  <title id="title">One researcher, every project</title>
  <desc id="desc">One researcher for any field: a lawyer, a CFO, an engineer, someone in HR, a student, or an investor. At the centre, you and your researcher: your library, your rules, your voice. Around it: your library with read and query, every answer citing its source; your decisions with study; learning with teach and the workshops; every morning, brief; safe by default, security; and investing when you want, the Lab with init-strategy and eight steps. New KaxaNuk tools arrive as skills with one word, update.</desc>
  <style>
    .sans { font-family: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .heavy { font-family: "Archivo Black", "Arial Black", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
    .mono { font-family: "JetBrains Mono", Consolas, "Courier New", monospace; }
  </style>
  <rect width="1200" height="640" fill="#F1EFEA"/>
  <text x="40" y="52" class="sans" font-size="15" letter-spacing="4" fill="#3A3A3A">THE KAXANUK RESEARCHER</text>
  <text x="40" y="112" class="heavy" font-size="46" fill="#111">ONE RESEARCHER, EVERY PROJECT<tspan fill="#E23B2A">.</tspan></text>
  <text x="40" y="148" class="sans" font-size="20" fill="#2A2A2A">Lawyer, CFO, engineer, HR, student, or investor. It learns you first; the rest is your choice.</text>

  <g stroke="#B8B4AC" stroke-width="2">
    <line x1="370" y1="226" x2="450" y2="330"/>
    <line x1="370" y1="356" x2="450" y2="360"/>
    <line x1="370" y1="486" x2="450" y2="390"/>
    <line x1="830" y1="226" x2="750" y2="330"/>
    <line x1="830" y1="356" x2="750" y2="360"/>
    <line x1="830" y1="486" x2="750" y2="390"/>
  </g>

  <rect x="450" y="290" width="300" height="140" fill="#111"/>
  <g class="sans" text-anchor="middle">
    <text x="600" y="336" font-size="22" font-weight="700" fill="#F1EFEA">You + your researcher</text>
    <text x="600" y="368" font-size="16" fill="#D8D5CE">your library · your rules · your voice</text>
    <text x="600" y="400" class="mono" font-size="15" fill="#F2543F">RESEARCHER.md</text>
  </g>

  <g class="sans">
    <rect x="40" y="176" width="330" height="100" fill="#E4E1DB"/>
    <text x="60" y="210" font-size="20" font-weight="700" fill="#111">Your library</text>
    <text x="60" y="238" class="mono" font-size="15" fill="#E23B2A">read · query</text>
    <text x="60" y="262" font-size="15" fill="#3A3A3A">every answer cites its source</text>

    <rect x="40" y="306" width="330" height="100" fill="#E4E1DB"/>
    <text x="60" y="340" font-size="20" font-weight="700" fill="#111">Your work and decisions</text>
    <text x="60" y="368" class="mono" font-size="15" fill="#E23B2A">study</text>
    <text x="60" y="392" font-size="15" fill="#3A3A3A">for and against, from what you read</text>

    <rect x="40" y="436" width="330" height="100" fill="#E4E1DB"/>
    <text x="60" y="470" font-size="20" font-weight="700" fill="#111">Learning</text>
    <text x="60" y="498" class="mono" font-size="15" fill="#E23B2A">teach · workshop</text>
    <text x="60" y="522" font-size="15" fill="#3A3A3A">a lesson a session, with a quiz</text>

    <rect x="830" y="176" width="330" height="100" fill="#E4E1DB"/>
    <text x="850" y="210" font-size="20" font-weight="700" fill="#111">Every morning</text>
    <text x="850" y="238" class="mono" font-size="15" fill="#E23B2A">brief</text>
    <text x="850" y="262" font-size="15" fill="#3A3A3A">your work, your markets, your week</text>

    <rect x="830" y="306" width="330" height="100" fill="#E4E1DB"/>
    <text x="850" y="340" font-size="20" font-weight="700" fill="#111">Safe by default</text>
    <text x="850" y="368" class="mono" font-size="15" fill="#E23B2A">security</text>
    <text x="850" y="392" font-size="15" fill="#3A3A3A">keys, personal data, confidential files</text>

    <rect x="830" y="436" width="330" height="100" fill="#E23B2A"/>
    <text x="850" y="470" font-size="20" font-weight="700" fill="#fff">Investing, when you want</text>
    <text x="850" y="498" class="mono" font-size="15" fill="#fff">init-strategy · the Lab</text>
    <text x="850" y="522" font-size="15" fill="#fff">eight steps, claims before any test</text>
  </g>

  <rect x="40" y="566" width="1120" height="48" fill="#111"/>
  <text x="600" y="597" class="sans" font-size="18" fill="#F1EFEA" text-anchor="middle">New KaxaNuk tools arrive as skills, with one word: <tspan class="mono" fill="#F2543F">update</tspan></text>
</svg>
