<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-labelledby="title desc">
  <title id="title">Your researcher knows the Lab and every step of the process</title>
  <desc id="desc">The eight steps of a KaxaNuk strategy: 1 Bibliotheca, 2 Universe, 3 Data, 4 Portfolio, 5 Backtest, 6 Attribution, 7 Paper trading, 8 Production, outside the Lab. You ask which step you are at; your researcher answers step 5, the backtest, and proposes one run of the Backtest Engine with its skill, for your approval. init-example copies the worked example to study; init-strategy makes yours, with the same folders.</desc>
  <style>
    .sans { font-family: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .heavy { font-family: "Archivo Black", "Arial Black", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
    .mono { font-family: "JetBrains Mono", Consolas, "Courier New", monospace; }
  </style>
  <rect width="1200" height="580" fill="#F1EFEA"/>
  <text x="40" y="52" class="sans" font-size="15" letter-spacing="4" fill="#3A3A3A">THE RESEARCHER AND THE LAB</text>
  <text x="40" y="112" class="heavy" font-size="46" fill="#111">YOUR RESEARCHER KNOWS THE LAB</text>
  <text x="40" y="164" class="heavy" font-size="46" fill="#111">AND EVERY STEP<tspan fill="#E23B2A">.</tspan></text>

  <g class="sans" font-size="21" font-weight="700">
    <rect x="40" y="200" width="260" height="72" fill="#E4E1DB"/>
    <text x="60" y="244" fill="#E23B2A">1</text><text x="90" y="244" fill="#111">Bibliotheca</text>
    <rect x="40" y="282" width="260" height="72" fill="#E4E1DB"/>
    <text x="60" y="326" fill="#E23B2A">2</text><text x="90" y="326" fill="#111">Universe</text>
    <rect x="40" y="364" width="260" height="72" fill="#E4E1DB"/>
    <text x="60" y="408" fill="#E23B2A">3</text><text x="90" y="408" fill="#111">Data</text>
    <rect x="40" y="446" width="260" height="72" fill="#E4E1DB"/>
    <text x="60" y="490" fill="#E23B2A">4</text><text x="90" y="490" fill="#111">Portfolio</text>

    <rect x="310" y="200" width="260" height="72" fill="#E23B2A"/>
    <text x="330" y="244" fill="#fff">5</text><text x="360" y="244" fill="#fff">Backtest</text>
    <rect x="310" y="282" width="260" height="72" fill="#E4E1DB"/>
    <text x="330" y="326" fill="#E23B2A">6</text><text x="360" y="326" fill="#111">Attribution</text>
    <rect x="310" y="364" width="260" height="72" fill="#E4E1DB"/>
    <text x="330" y="408" fill="#E23B2A">7</text><text x="360" y="408" fill="#111">Paper trading</text>
    <rect x="311" y="447" width="258" height="70" fill="none" stroke="#B8B4AC" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="330" y="478" fill="#E23B2A">8</text><text x="360" y="478" fill="#555">Production,</text>
    <text x="360" y="502" fill="#555">outside the Lab</text>
  </g>

  <rect x="600" y="200" width="560" height="318" fill="#111"/>
  <g class="sans">
    <text x="628" y="236" font-size="19" font-weight="700" fill="#F2543F">You</text>
    <text x="628" y="266" font-size="19" fill="#F1EFEA">Which step am I at?</text>
    <line x1="628" y1="290" x2="1132" y2="290" stroke="#3A3A3A"/>
    <text x="628" y="322" font-size="19" font-weight="700" fill="#F2543F">Your researcher</text>
    <text x="628" y="352" font-size="19" fill="#F1EFEA">Step 5, the backtest. Plan: one run of the</text>
    <text x="628" y="378" font-size="19" fill="#F1EFEA">Backtest Engine with its skill. Do you approve?</text>
    <line x1="628" y1="402" x2="1132" y2="402" stroke="#3A3A3A"/>
  </g>
  <g class="mono" font-size="17">
    <text x="628" y="440"><tspan fill="#F2543F">init-example</tspan><tspan fill="#F1EFEA"> · the worked example, to study</tspan></text>
    <text x="628" y="478"><tspan fill="#F2543F">init-strategy</tspan><tspan fill="#F1EFEA"> · yours, with the same folders</tspan></text>
  </g>

  <text x="40" y="556" class="sans" font-size="16" fill="#3A3A3A">One skill per library · a plan and your go before it writes · the numbers come only from the Lab</text>
</svg>
