# The KaxaNuk Researcher: this repository is one APM package, and it carries every KaxaNuk skill,
# instruction and command in `.apm/` — the researcher's, the process's, each Investment Lab
# library's and the house rules. `templates/` and `examples/` are what `init-researcher`,
# `init-strategy` and `init-example` copy. It depends on nothing, so one install brings everything,
# once for the user:
#
#     apm install -g KaxaNuk/KaxaNuk-Researcher --target claude
#
# and `apm update -g` brings every new version to every folder.
name: kaxanuk-researcher
version: 0.14.2
description: The KaxaNuk Researcher — a companion you name and teach, with the KaxaNuk Strategy Template's process built in, that keeps a library of what you read and drafts the hypothesis of every strategy you build; with every Investment Lab skill, init-researcher, init-strategy and init-example, and the template, worked example and home they copy.
author: Arturo Aguilar
license: MIT
dependencies:
  apm: []
  mcp: []
includes: auto
scripts: {}
