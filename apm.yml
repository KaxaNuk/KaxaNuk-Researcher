name: kaxanuk-researcher
version: 0.2.0
description: A KaxaNuk researcher — a companion you name and teach, with core knowledge of the KN Research Process and the Investment Lab modules
author: KaxaNuk
license: MIT

# The skills are authored in `.claude/skills/`, the only directory Claude Code reads, and mirrored
# to `.agents/skills/`, which the other assistants read. Both are committed, so a clone works with
# nothing installed. This file exists so the same skills can also be installed into a project
# somebody already has — `apm install KaxaNuk/KaxaNuk-Researcher` — and packed as a plain plugin
# bundle with `apm pack`.

# No dependencies. `KaxaNuk/KaxaNuk-APM/common` was here, but it installs Python style rules —
# pep8, test-writing, bloom-code — into every assistant's context, and there is almost no code in
# this repository. It comes back when there is a KaxaNuk package that teaches research rather than
# linting. `data-curator` and `investment-lab` are on the KN roadmap but do not exist in that
# repository yet.
dependencies:
  apm: []
  mcp: []

targets:
  - claude
  - copilot
  - cursor
  - codex
  - gemini
  - opencode
  - windsurf

# What publishes. Named explicitly rather than inferred: a wrong inference here would ship
# somebody's private reading list.
includes:
  - .claude/skills/
