name: kaxanuk-researcher
version: 0.4.0
description: A KaxaNuk researcher — a companion you name and teach, with the KN Research Process built in, that keeps a library of what you read and drafts the hypothesis of every strategy you build
author: KaxaNuk
license: MIT

# `.apm/` is the researcher: `apm install --target <agent>` copies its skills, commands and agent
# into that agent's folders, which git ignores. Add the packages your own work needs below.
dependencies:
  apm: []
  mcp: []

# A bare `apm install` deploys to every target below; `--target <one>` deploys to just yours.
targets:
  - claude
  - copilot
  - cursor
  - codex
  - gemini
  - opencode
  - windsurf

# What publishes: `.apm/` and nothing else — checked with `apm pack`, so a private reading list
# under `Sources/` or `Knowledge/` cannot ship.
includes: auto
