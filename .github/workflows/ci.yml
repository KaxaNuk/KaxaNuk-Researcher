# Every push and pull request: the tests, ruff (the worked example with its own settings), the
# repository's own checks, and the Bloom Code style of the scripts, the tests, the tools and the
# worked example, checked by the repository's own `bloom-code-lint`.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tests
        run: uv run --no-project --with pytest --with pypdf pytest -q
      - name: Ruff
        run: uvx ruff check .
      - name: Ruff, the worked example
        working-directory: examples/liquid-golden-cross
        run: uvx ruff check .
      - name: Repository checks
        run: uv run --no-project python tools/check_repo.py
      # --local-package names only the modules the tests import with `from x import y`.
      - name: Bloom Code
        run: |
          uv run --no-project python .apm/skills/bloom-code-lint/scripts/bloom_code_check.py \
            .apm/skills/*/scripts tests tools examples/liquid-golden-cross \
            --local-package bloom_code_check
