# Every push and pull request: the tests, ruff, the repository's own checks, and the Bloom Code
# style of the scripts, checked by the repository's own `bloom-code-lint`.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tests
        run: uv run --no-project --with pytest --with pypdf pytest -q
      - name: Ruff
        run: uvx ruff check .
      - name: Repository checks
        run: uv run --no-project python tools/check_repo.py
      - name: Bloom Code
        run: |
          uv run --no-project python .apm/skills/bloom-code-lint/scripts/bloom_code_check.py \
            .apm/skills/*/scripts tests tools \
            --local-package scaffold --local-package check_repo --local-package extract \
            --local-package bloom_code_check --local-package propagate_mcp_env_vars \
            --local-package sync_investment_lab_references
