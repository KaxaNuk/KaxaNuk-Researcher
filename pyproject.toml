# The development environment for this repository's scripts and tools, and their tests. The
# worked example in `examples/` carries its own `pyproject.toml`, which governs it alone.
[project]
name = "kaxanuk-researcher"
version = "0.7.1"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "apm-cli",
    "pypdf",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["examples", "templates"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
]
