# This repository's ruff and pytest settings, for the skills' scripts and their tests. The worked
# example in `examples/` carries its own `pyproject.toml`, which governs it alone.
[project]
name = "kaxanuk-researcher"
version = "0.19.0"
requires-python = ">=3.12"
dependencies = []

# The tests' own dependencies: `uv run --group dev pytest` installs them.
[dependency-groups]
dev = [
    "pypdf[crypto]>=4.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["examples", "templates"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
]
